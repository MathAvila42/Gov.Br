<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opções de ajuda</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) 0;
  }

  h1.title {
    text-align: center;
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--govbr-blue);
    margin: 0 0 var(--space-xl);
  }

  .help-option {
    display: flex;
    align-items: flex-start;
    gap: var(--space-md);
    width: 100%;
    background: var(--gray-100);
    border: 2px solid var(--gray-300);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    margin-bottom: var(--space-md);
    cursor: pointer;
  }

  .help-option:has(input:checked) {
    border-color: var(--govbr-blue);
    background: #f3f7fd;
  }

  .help-option:has(input:focus-visible) {
    outline: 3px solid var(--govbr-blue-vivid);
    outline-offset: 2px;
  }

  .help-option .option-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 2px;
  }

  .help-option .option-label {
    font-size: var(--fs-body);
    font-weight: 700;
    color: var(--gray-900);
    line-height: 1.3;
  }

  .help-option .option-desc {
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    line-height: 1.4;
    margin: 0;
  }

  .help-option input[type="checkbox"] {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    margin: 2px 0 0;
    accent-color: var(--govbr-blue);
    cursor: pointer;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: var(--space-md) var(--page-x) var(--space-xs);
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="title">Você pode contar com apoio durante todo o uso do aplicativo</h1>

    <label class="help-option">
      <input id="opt-voz" type="checkbox">
      <span class="option-text">
        <span class="option-label">Quero ouvir orientações por voz</span>
        <span class="option-desc">Uma assistente virtual do Gov.Br ajudará você com a sua dúvida.</span>
      </span>
    </label>

    <label class="help-option">
      <input id="opt-confirmacoes" type="checkbox">
      <span class="option-text">
        <span class="option-label">Quero uma confirmação extra de cada etapa realizada</span>
      </span>
    </label>

    <label class="help-option">
      <input id="opt-passo-a-passo" type="checkbox">
      <span class="option-text">
        <span class="option-label">Quero assistir o passo a passo de cada serviço</span>
      </span>
    </label>
  </div>

  <div class="bottom-section">
    <button class="br-button primary large block" type="button" onclick="location.href='senha.html'">Próximo</button>
  </div>

  <div class="step-dots">
    <span class="dot"></span>
    <span class="dot active"></span>
    <span class="dot"></span>
  </div>

</div>
</body>
</html>
