<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Opções de ajuda</title>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: 48px 24px 0;
  }

  h1.title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--govbr-blue);
    margin: 0 0 40px;
  }

  .br-checkbox {
    margin-bottom: 28px;
  }

  .br-checkbox label {
    font-size: 16px;
    font-weight: 400;
  }

  .help-note {
    color: var(--govbr-gray);
    font-size: 14px;
    line-height: 1.43;
    margin: 8px 0 0;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 16px 24px 8px;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <h1 class="title">Opções de ajuda</h1>

    <div class="br-checkbox">
      <input id="opt-tutorial" type="checkbox" checked>
      <label for="opt-tutorial">Tutorial de boas-vindas</label>
    </div>
    <div class="br-checkbox">
      <input id="opt-guia" type="checkbox" checked>
      <label for="opt-guia">Guia passo-a-passo</label>
    </div>
    <div class="br-checkbox">
      <input id="opt-confirmacoes" type="checkbox">
      <label for="opt-confirmacoes">Confirmações extra a cada etapa</label>
    </div>
    <div class="br-checkbox">
      <input id="opt-assistente" type="checkbox">
      <label for="opt-assistente">Assistente virtual</label>
    </div>

    <p class="help-note">As configurações podem ser alteradas nas opções do aplicativo</p>
  </div>

  <div class="bottom-section">
    <button class="br-button primary large block" type="button" onclick="location.href='entrar.html'">Confirmar</button>
  </div>

  <div class="step-dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot active"></span>
    <span class="dot"></span>
  </div>

</div>
</body>
</html>
