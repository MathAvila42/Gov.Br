<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vamos provar que é você</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) var(--space-lg);
  }

  h1.title {
    text-align: center;
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--govbr-blue);
    margin: 0 0 var(--space-sm);
  }

  p.subtitle {
    text-align: center;
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    margin: 0 0 var(--space-xl);
  }

  .verify-option {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    width: 100%;
    text-align: left;
    background: var(--gray-100);
    border: none;
    border-radius: var(--radius-md);
    padding: var(--space-md);
    margin-bottom: var(--space-md);
    font-size: var(--fs-body);
    font-family: inherit;
    color: var(--gray-900);
    cursor: pointer;
    min-height: var(--touch-target);
  }

  .verify-option .icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #eef3fc;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .verify-option span.label {
    flex: 1;
    font-size: var(--fs-body);
  }

  .verify-option .chevron {
    flex-shrink: 0;
    color: var(--gray-500);
  }

  .verify-option:hover,
  .verify-option:focus-visible {
    background: #f3f7fd;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="title">Vamos provar que é você</h1>
    <p class="subtitle">Escolha como você quer confirmar sua identidade</p>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span class="label">Mensagem SMS</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html?via=email'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M3 6l9 7 9-7" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="label">E-mail</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

  </div>

</div>
</body>
</html>
