<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vamos provar que é você</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: 48px 24px 24px;
  }

  h1.title {
    text-align: center;
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--govbr-blue);
    margin: 0 0 12px;
  }

  p.subtitle {
    text-align: center;
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    margin: 0 0 32px;
  }

  .verify-option {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    background: #fff;
    border: 2px solid #b0b0b0;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 18px;
    font-size: var(--fs-body);
    font-family: inherit;
    color: #1c1c1c;
    cursor: pointer;
    min-height: var(--touch-target);
  }

  .verify-option .icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #eef3fc;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .verify-option span.label {
    flex: 1;
  }

  .verify-option .chevron {
    flex-shrink: 0;
    color: #949494;
  }

  .verify-option:hover,
  .verify-option:focus-visible {
    border-color: var(--govbr-blue);
    background: #f3f7fd;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <h1 class="title">Vamos provar que é você</h1>
    <p class="subtitle">Escolha como você quer confirmar sua identidade</p>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
      <span class="label">Mensagem SMS</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M3 6l9 7 9-7" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="label">E-mail</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#1351b4" stroke-width="1.8"/><circle cx="12" cy="10" r="3" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M6 18c1.2-2.6 3.4-4 6-4s4.8 1.4 6 4" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
      <span class="label">Reconhecimento facial</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="label">App Autenticador</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="verify-option" type="button" onclick="location.href='codigo-sms.html'">
      <span class="icon"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01" stroke="#1351b4" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <span class="label">Código de verificação</span>
      <svg class="chevron" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div>
</body>
</html>
