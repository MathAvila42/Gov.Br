<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insira código SMS</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) 0;
  }

  h1.title {
    text-align: center;
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--govbr-blue);
    margin: 0 0 var(--space-sm);
  }

  p.subtitle {
    text-align: center;
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    line-height: 1.5;
    margin: 0 0 var(--space-xl);
  }

  .code-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-md);
    max-width: 280px;
    margin: 0 auto var(--space-xl);
  }

  .code-grid input {
    width: 100%;
    aspect-ratio: 3 / 4;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    border: 2px solid var(--gray-500);
    border-radius: var(--radius-md);
    background: #fff;
    color: var(--gray-900);
  }

  .code-grid input:focus {
    outline: none;
    border-color: var(--govbr-blue);
    box-shadow: 0 0 0 3px rgba(19, 81, 180, 0.25);
  }

  .resend {
    display: block;
    text-align: center;
    background: none;
    border: none;
    font-family: inherit;
    font-size: var(--fs-small);
    font-weight: 700;
    color: var(--govbr-blue);
    padding: var(--space-sm);
    margin: 0 auto;
    cursor: pointer;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-xs);
  }

  .auto-fill-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  .auto-fill-popup {
    width: 260px;
    background: #fff;
    border-radius: var(--radius-md);
    padding: var(--space-lg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  .auto-fill-popup p {
    font-size: var(--fs-body);
    font-weight: 600;
    color: var(--gray-900);
    margin: 0 0 var(--space-md);
  }

  .auto-fill-progress {
    height: 6px;
    border-radius: 3px;
    background: var(--gray-200);
    overflow: hidden;
  }

  .auto-fill-progress-bar {
    height: 100%;
    width: 0%;
    background: var(--govbr-blue);
    border-radius: 3px;
    transition: width 5s linear;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="title" id="title">Insira código SMS</h1>
    <p class="subtitle" id="subtitle">Enviamos um código de 6 dígitos por SMS para o número cadastrado</p>

    <div class="code-grid">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 1 do código">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2 do código">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3 do código">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4 do código">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5 do código">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6 do código">
    </div>

    <button class="resend" type="button" id="resend">Reenviar código</button>
  </div>

  <div class="bottom-section">
    <button class="br-button primary large block" type="button" onclick="location.href='dashboard.html'">Confirmar</button>
  </div>

</div>

<script>
  const boxes = document.querySelectorAll('.code-grid input');
  boxes.forEach((box, i) => {
    box.addEventListener('input', () => {
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
    });
  });

  const AUTO_CODE = '386925';
  const phone = document.querySelector('.phone');

  const isEmail = new URLSearchParams(location.search).get('via') === 'email';
  if (isEmail) {
    document.getElementById('title').textContent = 'Insira código enviado por e-mail';
    document.getElementById('subtitle').textContent = 'Enviamos um código de 6 dígitos por e-mail para o endereço cadastrado';
    document.getElementById('resend').textContent = 'Reenviar e-mail';
  }

  setTimeout(() => {
    boxes.forEach((box, i) => { box.value = AUTO_CODE[i]; });

    setTimeout(() => {
      const overlay = document.createElement('div');
      overlay.className = 'auto-fill-overlay';
      overlay.innerHTML =
        '<div class="auto-fill-popup">' +
          '<p>Inserimos o código automaticamente para você</p>' +
          '<div class="auto-fill-progress"><div class="auto-fill-progress-bar"></div></div>' +
        '</div>';
      phone.appendChild(overlay);

      const bar = overlay.querySelector('.auto-fill-progress-bar');
      requestAnimationFrame(() => { bar.style.width = '100%'; });

      setTimeout(() => {
        overlay.remove();
        location.href = 'dashboard.html';
      }, 5000);
    }, 3000);
  }, 3000);
</script>
</body>
</html>
