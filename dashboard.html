<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gov.br</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md) var(--page-x);
    flex-shrink: 0;
    background: #fff;
    position: relative;
    z-index: 2;
  }

  .top-bar-logo {
    height: 28px;
    width: auto;
  }

  .top-bar .icons {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:hover {
    background: #f0f0f0;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--govbr-blue-dark);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    border: 2px solid var(--gray-200);
  }

  /* ---------- Level banner (patterned after the real gov.br home screen) ---------- */
  .level-banner {
    background: var(--govbr-blue);
    padding: var(--space-md) var(--page-x) var(--space-2xl);
    flex-shrink: 0;
  }

  .level-banner .greet {
    color: #fff;
    font-size: var(--fs-body);
    margin: 0 0 var(--space-xs);
  }
  .level-banner .greet strong {
    font-weight: 700;
    text-transform: uppercase;
  }

  .level-banner .level-label {
    color: #fff;
    font-size: var(--fs-label);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin: 0 0 var(--space-md);
  }

  .level-progress {
    display: flex;
    gap: 4px;
  }

  .level-progress span {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.35);
  }

  .level-progress span.filled {
    background: #fff;
  }

  /* ---------- Rounded content card overlapping the banner, with the level CTA on the seam ---------- */
  .content-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #fff;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    margin-top: -20px;
    position: relative;
    z-index: 1;
  }

  .level-cta {
    position: absolute;
    top: -20px;
    right: var(--page-x);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: var(--govbr-blue);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    font-family: inherit;
  }

  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 40px var(--page-x) var(--space-md);
  }

  .search-bar {
    position: relative;
    margin-bottom: var(--space-xl);
  }

  .search-bar input {
    width: 100%;
    height: var(--touch-target);
    border: 1px solid var(--gray-400);
    border-radius: var(--radius-md);
    padding: 0 48px 0 var(--space-md);
    font-size: var(--fs-body);
    font-style: italic;
    color: var(--gray-700);
    font-family: inherit;
  }

  .search-bar .search-icon {
    position: absolute;
    right: var(--space-md);
    top: 50%;
    transform: translateY(-50%);
    color: var(--govbr-blue);
    pointer-events: none;
  }

  h2.section-title {
    font-size: var(--fs-label);
    font-weight: 700;
    color: var(--gray-900);
    margin: 0 0 var(--space-md);
  }

  .services-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }

  .service-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    min-height: 110px;
    border: 2px solid var(--gray-300);
    border-radius: var(--radius-md);
    background: #fff;
    padding: var(--space-md) var(--space-xs);
    cursor: pointer;
    font-family: inherit;
  }

  .service-card:hover,
  .service-card:focus-visible {
    border-color: var(--govbr-blue);
    background: #f3f7fd;
  }

  .service-card.hidden {
    display: none;
  }

  .service-card .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #eef3fc;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .service-card .label {
    font-size: var(--fs-small);
    font-weight: 600;
    color: var(--gray-900);
    text-align: center;
    line-height: 1.3;
  }

  /* ---------- Bottom tab bar with elevated center FAB ---------- */
  .bottom-nav {
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    background: #fff;
    border-top: 1px solid var(--gray-200);
    padding: var(--space-xs) var(--space-2xs) max(var(--space-xs), env(safe-area-inset-bottom));
    position: relative;
    z-index: 2;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    font-family: inherit;
    color: var(--gray-600);
    font-size: 11px;
    font-weight: 600;
    padding: var(--space-2xs) var(--space-xs);
    min-width: 56px;
    cursor: pointer;
  }

  .nav-item.active {
    color: var(--govbr-blue);
  }

  /* ---------- First-run onboarding tour (spotlight + tooltip) ---------- */
  #onboarding-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
  }

  .onboarding-spotlight {
    position: absolute;
    border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.65);
    pointer-events: none;
  }

  .onboarding-tooltip {
    position: absolute;
    width: 240px;
    background: #fff;
    border-radius: var(--radius-md);
    padding: var(--space-md) var(--space-lg);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

  .onboarding-tooltip .step-count {
    font-size: 12px;
    font-weight: 700;
    color: var(--govbr-blue);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 0 0 4px;
  }

  .onboarding-tooltip h3 {
    font-size: var(--fs-label);
    font-weight: 700;
    color: var(--gray-900);
    margin: 0 0 6px;
  }

  .onboarding-tooltip p.desc {
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    line-height: 1.4;
    margin: 0 0 var(--space-md);
  }

  .onboarding-tooltip button {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 999px;
    background: var(--govbr-blue);
    color: #fff;
    font-weight: 700;
    font-size: var(--fs-small);
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="top-bar">
    <img class="top-bar-logo" src="assets/govbr-logo.png" alt="gov.br">
    <div class="icons">
      <button class="icon-btn" type="button" aria-label="Notificações">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3C8.5 3 6 5.7 6 9v3.5L4 16h16l-2-3.5V9c0-3.3-2.5-6-6-6z" fill="none" stroke="#101010" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="#101010" stroke-width="1.8"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Minha conta">
        <div class="avatar">M</div>
      </button>
    </div>
  </div>

  <div class="level-banner">
    <p class="greet">Olá, <strong>Maria</strong></p>
    <p class="level-label">Sua conta é nível <strong>ouro</strong></p>
    <div class="level-progress">
      <span class="filled"></span>
      <span class="filled"></span>
      <span></span>
    </div>
  </div>

  <div class="content-wrap">
    <button class="level-cta" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 17l6-6 4 4 6-8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 6h6v6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Aumentar nível
    </button>

    <div class="content">
      <div class="search-bar">
        <input type="text" placeholder="Encontre serviços públicos no gov.br">
        <span class="search-icon">
          <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.5" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </div>

      <h2 class="section-title">Serviços</h2>

      <div class="services-grid">
        <button class="service-card" type="button" data-label="Meu INSS">
          <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="label">Meu INSS</span>
        </button>
        <button class="service-card" type="button" data-label="Cartão do SUS">
          <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 8.5c0 5-3.5 9-8 11.5-4.5-2.5-8-6.5-8-11.5a8 8 0 0 1 16 0z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6v6l4 2" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
          <span class="label">Cartão do SUS</span>
        </button>
        <button class="service-card" type="button" data-label="Meus documentos" onclick="location.href='documentos.html'">
          <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#1351b4" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span class="label">Meus documentos</span>
        </button>
        <button class="service-card" type="button" data-label="Meus benefícios">
          <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
          <span class="label">Meus benefícios</span>
        </button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Início
    </button>
    <button class="nav-item" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="9" y="2.5" width="6" height="3" rx="1" fill="currentColor"/><line x1="9" y1="11" x2="15" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Dados
    </button>
    <button class="nav-item" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="14.5" r="1.4" fill="currentColor"/></svg>
      Carteira
    </button>
    <button class="nav-item" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Menu
    </button>
  </div>

</div>

<script>
  var searchInput = document.querySelector('.search-bar input');
  var cards = document.querySelectorAll('.service-card');
  searchInput.addEventListener('input', function() {
    var q = searchInput.value.trim().toLowerCase();
    cards.forEach(function(card) {
      var label = card.getAttribute('data-label').toLowerCase();
      card.classList.toggle('hidden', q !== '' && !label.includes(q));
    });
  });
</script>

<script>
  (function() {
    var seen = null;
    try { seen = localStorage.getItem('govbr_onboarding_done'); } catch (e) {}
    if (seen) return;

    var steps = [
      { selector: '.search-bar', title: 'Campo de busca', desc: 'Digite aqui para encontrar rapidamente os serviços que você precisa.' },
      { selector: '.services-grid', title: 'Serviços mais usados', desc: 'Aqui ficam os serviços que você mais utiliza, com acesso rápido.' },
      { selector: '.avatar', title: 'Seu perfil', desc: 'Toque aqui para ver e editar suas informações pessoais.' }
    ];
    var current = 0;

    var phone = document.querySelector('.phone');
    var overlay = document.createElement('div');
    overlay.id = 'onboarding-overlay';

    var spotlight = document.createElement('div');
    spotlight.className = 'onboarding-spotlight';

    var tooltip = document.createElement('div');
    tooltip.className = 'onboarding-tooltip';
    tooltip.innerHTML =
      '<p class="step-count"></p>' +
      '<h3></h3>' +
      '<p class="desc"></p>' +
      '<button type="button"></button>';

    overlay.appendChild(spotlight);
    overlay.appendChild(tooltip);
    phone.appendChild(overlay);

    var stepCountEl = tooltip.querySelector('.step-count');
    var titleEl = tooltip.querySelector('h3');
    var descEl = tooltip.querySelector('.desc');
    var btnEl = tooltip.querySelector('button');

    function render() {
      var step = steps[current];
      var target = document.querySelector(step.selector);
      var phoneRect = phone.getBoundingClientRect();
      var rect = target.getBoundingClientRect();
      var pad = 8;

      var top = rect.top - phoneRect.top - pad;
      var left = rect.left - phoneRect.left - pad;
      var width = rect.width + pad * 2;
      var height = rect.height + pad * 2;

      spotlight.style.top = top + 'px';
      spotlight.style.left = left + 'px';
      spotlight.style.width = width + 'px';
      spotlight.style.height = height + 'px';

      stepCountEl.textContent = (current + 1) + ' de ' + steps.length;
      titleEl.textContent = step.title;
      descEl.textContent = step.desc;
      btnEl.textContent = current === steps.length - 1 ? 'Concluir' : 'Avançar';

      var tooltipLeft = Math.max(16, Math.min(left, phoneRect.width - 240 - 16));
      tooltip.style.left = tooltipLeft + 'px';

      var spaceBelow = phoneRect.height - (top + height);
      if (spaceBelow > 170) {
        tooltip.style.top = (top + height + 12) + 'px';
        tooltip.style.bottom = 'auto';
      } else {
        tooltip.style.top = 'auto';
        tooltip.style.bottom = (phoneRect.height - top + 12) + 'px';
      }
    }

    btnEl.addEventListener('click', function() {
      current++;
      if (current >= steps.length) {
        try { localStorage.setItem('govbr_onboarding_done', '1'); } catch (e) {}
        overlay.remove();
        return;
      }
      render();
    });

    render();
    window.addEventListener('resize', render);
  })();
</script>
</body>
</html>
