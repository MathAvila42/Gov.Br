<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gov.br</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md) var(--page-x);
    flex-shrink: 0;
  }

  .top-bar-logo {
    height: 28px;
    width: auto;
  }

  .top-bar .icons {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn:hover {
    background: #f0f0f0;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #595959;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
  }

  .greeting-panel {
    background: var(--gray-200);
    padding: var(--space-md) var(--page-x) var(--space-lg);
    flex-shrink: 0;
  }

  .greeting-panel .ola {
    font-size: var(--fs-body);
    color: var(--govbr-text);
    font-weight: 700;
    margin: 0 0 4px;
  }

  .greeting-panel .sub {
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    margin: 0 0 12px;
  }

  .nivel-badge {
    display: inline-block;
    background: #cb8400;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: var(--space-2xs) var(--space-sm);
    border-radius: var(--radius-xs);
  }

  .content {
    flex: 1;
    padding: var(--space-lg) var(--page-x) 0;
  }

  .br-input {
    margin-bottom: var(--space-lg);
  }

  h2.section-title {
    font-size: var(--fs-label);
    font-weight: 700;
    color: var(--gray-900);
    margin: 0 0 var(--space-md);
  }

  .services-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }

  .service-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    min-height: 110px;
    border: 2px solid var(--gray-300);
    border-radius: var(--radius-md);
    background: #fff;
    padding: var(--space-md) var(--space-xs);
    cursor: pointer;
    font-family: inherit;
  }

  .service-card:hover,
  .service-card:focus-visible {
    border-color: var(--govbr-blue);
    background: #f3f7fd;
  }

  .service-card .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #eef3fc;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .service-card .label {
    font-size: var(--fs-small);
    font-weight: 600;
    color: var(--gray-900);
    text-align: center;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="top-bar">
    <img class="top-bar-logo" src="assets/govbr-logo.png" alt="gov.br">
    <div class="icons">
      <button class="icon-btn" type="button" aria-label="Notificações">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3C8.5 3 6 5.7 6 9v3.5L4 16h16l-2-3.5V9c0-3.3-2.5-6-6-6z" fill="none" stroke="#101010" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="#101010" stroke-width="1.8"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Minha conta">
        <div class="avatar">M</div>
      </button>
    </div>
  </div>

  <div class="greeting-panel">
    <p class="ola">Olá, Maria</p>
    <p class="sub">Bem-vinda de volta</p>
    <span class="nivel-badge">nível ouro</span>
  </div>

  <div class="content">
    <div class="br-input">
      <input type="text" placeholder="Pesquisar serviços">
    </div>

    <h2 class="section-title">Serviços</h2>
    <div class="services-grid">
      <button class="service-card" type="button">
        <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="label">Meu INSS</span>
      </button>
      <button class="service-card" type="button">
        <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 8.5c0 5-3.5 9-8 11.5-4.5-2.5-8-6.5-8-11.5a8 8 0 0 1 16 0z" fill="none" stroke="#1351b4" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6v6l4 2" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
        <span class="label">Cartão do SUS</span>
      </button>
      <button class="service-card" type="button">
        <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#1351b4" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <span class="label">Meus documentos</span>
      </button>
      <button class="service-card" type="button">
        <span class="icon"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="#1351b4" stroke-width="1.8"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" stroke="#1351b4" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>
        <span class="label">Meus benefícios</span>
      </button>
    </div>
  </div>

</div>
</body>
</html>
