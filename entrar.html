<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>entrar</title>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: 40px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1.title {
    font-size: 20px;
    font-weight: 600;
    color: #000000;
    margin: 0 0 48px;
  }

  .entrar-logo {
    width: 240px;
    height: auto;
    margin-bottom: 64px;
  }

  .br-input {
    width: 100%;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 24px 8px;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <h1 class="title">entrar</h1>
    <img class="entrar-logo" src="assets/govbr-logo.png" alt="gov.br">

    <div class="br-input">
      <input type="text" placeholder="Número de CPF">
    </div>
  </div>

  <div class="bottom-section">
    <button class="br-button primary large block" type="button" onclick="location.href='index.html'">Confirmar</button>
  </div>

  <div class="step-dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot active"></span>
  </div>

</div>
</body>
</html>
