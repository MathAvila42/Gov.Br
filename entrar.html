<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>entrar</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1.title {
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--gray-900);
    margin: 0 0 var(--space-xl);
  }

  .entrar-logo {
    width: 220px;
    max-width: 56%;
    height: auto;
    margin-bottom: var(--space-lg);
  }

  .success-row {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    color: var(--govbr-green);
    font-size: var(--fs-small);
    font-weight: 700;
    margin-bottom: var(--space-lg);
    align-self: flex-start;
  }

  .br-input {
    width: 100%;
    margin-bottom: var(--space-lg);
  }

  .br-input.input-button button.br-button {
    color: var(--govbr-gray);
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-xs);
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <h1 class="title">entrar</h1>
    <img class="entrar-logo" src="assets/govbr-logo.png" alt="gov.br">

    <div class="success-row">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--govbr-green)"/><path d="M7 12.5l3 3 7-7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      cpf validado com sucesso
    </div>

    <div class="br-input input-button">
      <label for="cpf-entrar">CPF</label>
      <input id="cpf-entrar" type="text" placeholder="Número de CPF">
      <button class="br-button" type="button" aria-label="Limpar campo" onclick="document.getElementById('cpf-entrar').value=''">
        <svg width="16" height="16" viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="br-input">
      <label for="senha-entrar">Senha</label>
      <input id="senha-entrar" type="password" placeholder="Senha">
    </div>
  </div>

  <div class="bottom-section">
    <button class="br-button primary large block" type="button" onclick="location.href='vamos-provar.html'">Confirmar</button>
  </div>

  <div class="step-dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot active"></span>
  </div>

</div>
</body>
</html>
