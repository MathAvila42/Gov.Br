<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>entrar</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .entrar-logo {
    width: 220px;
    max-width: 56%;
    height: auto;
    flex-shrink: 0;
  }

  .spacer-lg {
    flex: 1.6;
  }

  .spacer-sm {
    flex: 1;
  }

  .field-wrap {
    width: 100%;
    flex-shrink: 0;
  }

  .cpf-underline {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--gray-400);
    background: transparent;
    font-size: var(--fs-body);
    color: var(--gray-900);
    padding: var(--space-sm) 2px;
    font-family: inherit;
  }

  .cpf-underline::placeholder {
    color: var(--gray-700);
    font-style: normal;
  }

  .cpf-underline:focus {
    border-bottom: 2px solid var(--govbr-blue);
  }

  .forgot-link {
    flex-shrink: 0;
    color: var(--govbr-blue);
    font-size: var(--fs-body);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-2xl);
  }

  .btn-primary,
  .btn-secondary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: var(--touch-target);
    border: none;
    border-radius: 999px;
    font-size: var(--fs-button);
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--govbr-blue);
    color: #fff;
    margin-bottom: var(--space-sm);
  }

  .btn-secondary {
    background: var(--gray-100);
    color: var(--gray-900);
  }

  .btn-secondary .inline-logo {
    height: 1.2em;
    width: auto;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <img class="entrar-logo" src="assets/govbr-logo.png" alt="gov.br">

    <div class="spacer-lg"></div>

    <div class="field-wrap">
      <input class="cpf-underline" type="text" inputmode="numeric" placeholder="Número de CPF" aria-label="Número de CPF">
    </div>

    <div class="spacer-sm"></div>

    <a class="forgot-link" href="#">Esqueci a senha</a>

    <div class="spacer-sm"></div>
  </div>

  <div class="bottom-section">
    <button class="btn-primary" type="button" onclick="location.href='vamos-provar.html'">Entrar</button>
    <button class="btn-secondary" type="button" onclick="location.href='cpf-login.html'">
      Entrar com <img class="inline-logo" src="assets/govbr-logo.png" alt="gov.br">
    </button>
  </div>

</div>
</body>
</html>
