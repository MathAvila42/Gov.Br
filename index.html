<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gov.br</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<!-- Design System de Governo Federal (@govbr-ds/core v3.7.0), vendored locally -->
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .phone {
    min-height: 808px;
    background:
      repeating-linear-gradient(115deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 90px),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 1px, transparent 1px, transparent 45px),
      #f7f7f8;
  }

  /* edge-to-edge hero: yellow band + photo run behind the status bar.
     Sized by aspect-ratio (not a fixed px height) so it scales with the phone's
     width on any device instead of being tied to one exact viewport size. */
  .hero-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 393 / 380;
    flex-shrink: 0;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .hero-yellow-band {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 34.6%;
    width: 30.5%;
    background: var(--govbr-yellow);
  }

  .hero-photo {
    position: absolute;
    left: 50%;
    bottom: 0;
    height: 100%;
    width: auto;
    max-width: none;
    transform: translateX(-50%);
    display: block;
  }

  .hero-logo {
    position: absolute;
    left: 50%;
    top: calc(100% - 6px);
    transform: translateX(-50%);
    width: 52.7%;
    max-width: 220px;
    height: auto;
    display: block;
    filter:
      drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
      drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
      drop-shadow(0 0 3px #fff);
  }

  .spacer {
    flex: 1;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-2xl);
    position: relative;
  }

  .br-sign-in.primary.block {
    --button-large: var(--touch-target);
    font-size: var(--fs-button);
    font-weight: 400;
    margin-bottom: 14px;
  }
  .br-sign-in strong {
    font-weight: 800;
  }

  p.entrar-sub {
    text-align: center;
    color: var(--govbr-gray);
    font-size: var(--fs-small);
    line-height: 1.4;
    margin: 0 0 32px;
  }
  p.entrar-sub strong {
    font-weight: 700;
    color: var(--govbr-text);
  }

  .qr-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--govbr-blue);
    font-weight: 700;
    font-size: var(--fs-small);
    margin-bottom: 8px;
    min-height: 44px;
  }

</style>
</head>
<body>
<div class="phone">

  <!-- hero image: yellow band + photo -->
  <div class="hero-wrap">

    <div class="hero">
      <div class="hero-yellow-band"></div>
      <img class="hero-photo" src="assets/hero-woman.png" alt="">
    </div>
    <img class="hero-logo" src="assets/govbr-logo.png" alt="gov.br">
  </div>

  <div class="spacer"></div>

  <div class="bottom-section">
    <button class="br-sign-in primary large block" type="button" onclick="location.href='vamos-la.html'">Começar</button>
    <p class="entrar-sub">Clique para <strong>criar</strong> ou <strong>acessar</strong> sua conta gov.br</p>

    <div class="qr-row">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <rect x="2" y="2" width="7" height="7" fill="none" stroke="#1351b4" stroke-width="1.8"/>
        <rect x="15" y="2" width="7" height="7" fill="none" stroke="#1351b4" stroke-width="1.8"/>
        <rect x="2" y="15" width="7" height="7" fill="none" stroke="#1351b4" stroke-width="1.8"/>
        <rect x="14" y="14" width="3" height="3" fill="#1351b4"/>
        <rect x="19" y="14" width="3" height="3" fill="#1351b4"/>
        <rect x="14" y="19" width="3" height="3" fill="#1351b4"/>
        <rect x="19" y="19" width="3" height="3" fill="#1351b4"/>
      </svg>
      Ler QR code
    </div>
  </div>

</div>
</body>
</html>
