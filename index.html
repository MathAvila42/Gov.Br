<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>gov.br</title>
<!-- Design System de Governo Federal (@govbr-ds/core v3.7.0), vendored locally -->
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .phone {
    height: 808px;
    background:
      repeating-linear-gradient(115deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 90px),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 1px, transparent 1px, transparent 45px),
      #f7f7f8;
  }

  /* edge-to-edge hero: yellow band + photo run behind the status bar */
  .hero-wrap {
    position: relative;
    height: 380px;
    flex-shrink: 0;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .hero-yellow-band {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 34.6%;
    width: 30.5%;
    background: var(--govbr-yellow);
  }

  .hero-photo {
    position: absolute;
    left: 50%;
    bottom: 0;
    height: 100%;
    width: auto;
    max-width: none;
    transform: translateX(-50%);
    display: block;
  }

  /* translucent status bar overlaid directly on the hero, white icons */
  .hero-wrap .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 23px;
    padding: 4px 22px 0;
    background: rgba(0, 0, 0, 0.25);
    z-index: 2;
    color: #fff;
  }
  .hero-wrap .status-bar .time,
  .hero-wrap .status-bar .right { color: #fff; }
  .hero-wrap .status-bar svg rect,
  .hero-wrap .status-bar svg line { fill: #fff; stroke: #fff; }
  .hero-wrap .status-bar .battery-pill { background: #fff; color: #101010; }

  .hero-logo {
    position: absolute;
    left: 50%;
    top: 374px;
    transform: translateX(-50%);
    width: 207px;
    height: auto;
    display: block;
    filter:
      drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
      drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
      drop-shadow(0 0 3px #fff);
  }

  .spacer {
    flex: 1;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 32px 48px;
    position: relative;
  }

  .br-sign-in.primary.block {
    --button-large: 35px;
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 10px;
  }
  .br-sign-in strong {
    font-weight: 800;
  }

  p.entrar-sub {
    text-align: center;
    color: #8a8a8a;
    font-size: 14px;
    margin: 0 0 40px;
  }
  p.entrar-sub strong {
    font-weight: 700;
    color: #6d6d6d;
  }

  .qr-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--govbr-blue);
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 8px;
  }

  .version {
    position: absolute;
    right: 26px;
    bottom: -2px;
    color: #a0a0a0;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- hero image: yellow band + photo, edge-to-edge with the status bar overlaid on top -->
  <div class="hero-wrap">

    <div class="status-bar">
      <div class="time">
        14:35
        <svg width="16" height="16" viewBox="0 0 24 24" class="bell">
          <path d="M12 3C8.5 3 6 5.7 6 9v3.5L4 16h16l-2-3.5V9c0-3.3-2.5-6-6-6z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="#fff" stroke-width="1.6"/>
          <line x1="3" y1="21" x2="21" y2="3" stroke="#fff" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="right">
        <svg width="18" height="12" viewBox="0 0 18 12" class="bars">
          <rect x="0" y="7" width="3" height="5" rx="0.5" fill="#fff"/>
          <rect x="5" y="5" width="3" height="7" rx="0.5" fill="#fff"/>
          <rect x="10" y="2.5" width="3" height="9.5" rx="0.5" fill="#fff"/>
          <rect x="15" y="0" width="3" height="12" rx="0.5" fill="#fff"/>
        </svg>
        <span>5G</span>
        <span class="battery-pill">54</span>
      </div>
    </div>

    <div class="hero">
      <div class="hero-yellow-band"></div>
      <img class="hero-photo" src="assets/hero-woman.png" alt="">
    </div>
    <img class="hero-logo" src="assets/govbr-logo.png" alt="gov.br">
  </div>

  <div class="spacer"></div>

  <div class="bottom-section">
    <button class="br-sign-in primary large block" type="button">Entrar com&nbsp;<strong>gov.br</strong></button>
    <p class="entrar-sub">Clique para <strong>criar</strong> ou <strong>acessar</strong> sua conta gov.br</p>

    <div class="qr-row">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <rect x="2" y="2" width="7" height="7" fill="none" stroke="#1351b4" stroke-width="1.8"/>
        <rect x="15" y="2" width="7" height="7" fill="none" stroke="#1351b4" stroke-width="1.8"/>
        <rect x="2" y="15" width="7" height="7" fill="none" stroke="#1351b4" stroke-width="1.8"/>
        <rect x="14" y="14" width="3" height="3" fill="#1351b4"/>
        <rect x="19" y="14" width="3" height="3" fill="#1351b4"/>
        <rect x="14" y="19" width="3" height="3" fill="#1351b4"/>
        <rect x="19" y="19" width="3" height="3" fill="#1351b4"/>
      </svg>
      Ler QR code
    </div>

    <span class="version">3.8.4</span>
  </div>

</div>
</body>
</html>
