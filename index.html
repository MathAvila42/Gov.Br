<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gov.br</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<!-- Design System de Governo Federal (@govbr-ds/core v3.7.0), vendored locally -->
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .phone {
    background: #f7f7f8;
  }

  .top-white {
    flex-shrink: 0;
    background: #f7f7f8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-3xl) 0 var(--space-2xl);
  }

  .top-white .top-logo {
    width: 58%;
    max-width: 230px;
    height: auto;
    display: block;
  }

  .blue-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background-color: var(--govbr-blue);
    background-image: url('assets/paper-texture.jpg');
    background-size: cover;
    background-position: center;
    background-blend-mode: overlay;
  }

  .greeting {
    padding: var(--space-2xl) var(--page-x) 0;
  }

  .greeting h1 {
    color: #fff;
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 var(--space-md);
  }

  .greeting p {
    color: rgba(255, 255, 255, 0.92);
    font-size: var(--fs-body);
    line-height: 1.5;
    margin: 0;
  }

  .spacer {
    flex: 1;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-2xl);
    position: relative;
  }

  .br-sign-in.primary.block {
    --button-large: var(--touch-target);
    background-color: #fff !important;
    color: var(--govbr-blue) !important;
    font-size: var(--fs-button);
    font-weight: 700;
  }

</style>
</head>
<body>
<div class="phone">

  <div class="top-white">
    <img class="top-logo" src="assets/govbr-logo.png" alt="gov.br">
  </div>

  <div class="blue-section">

    <div class="greeting">
      <h1>Olá!</h1>
      <p>Consulte seus documentos e utilize serviços do Governo Federal com rapidez, segurança e facilidade.</p>
    </div>

    <div class="spacer"></div>

    <div class="bottom-section">
      <button class="br-sign-in primary large block" type="button" onclick="location.href='vamos-la.html'">Começar</button>
    </div>

  </div>

</div>
</body>
</html>
