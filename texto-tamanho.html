<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qual texto você lê melhor?</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) var(--space-md);
    display: flex;
    flex-direction: column;
  }

  h1.title {
    text-align: center;
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--govbr-blue);
    margin: 0 0 var(--space-md);
  }

  p.subtitle {
    text-align: center;
    font-size: var(--fs-small);
    color: var(--govbr-gray);
    margin: 0 0 var(--space-xl);
  }

  .size-option {
    display: block;
    cursor: pointer;
    background: var(--gray-100);
    border: 3px solid var(--gray-300);
    border-radius: var(--radius-md);
    padding: var(--space-lg) var(--space-md);
    margin-bottom: var(--space-lg);
    color: var(--gray-900);
    font-weight: 400;
    min-height: var(--touch-target);
  }

  .size-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .size-option.small { font-size: 17px; line-height: 1.4; }
  .size-option.large { font-size: 24px; line-height: 1.35; font-weight: 500; }

  .size-option:has(input:checked) {
    border-color: var(--govbr-blue);
    background: #dce8fa;
  }

  .size-option:has(input:focus-visible) {
    outline: 3px solid var(--govbr-blue-vivid);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <h1 class="title">Qual texto você lê melhor?</h1>
    <p class="subtitle">Escolha o tamanho de letra mais confortável para você. Dá para mudar depois quando quiser.</p>

    <label class="size-option small">
      <input type="radio" name="tamanho-texto" value="pequeno">
      Texto comprido aqui pra teste de tamanho
    </label>

    <label class="size-option large">
      <input type="radio" name="tamanho-texto" value="grande">
      Texto comprido aqui pra teste de tamanho
    </label>
  </div>

  <div class="step-dots">
    <span class="dot"></span>
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

</div>

<script>
  var saved = 'normal';
  try { saved = localStorage.getItem('govbr_text_scale') || 'normal'; } catch(e) {}
  var radios = document.querySelectorAll('input[name="tamanho-texto"]');
  radios.forEach(function(r) {
    r.checked = (saved === 'large' && r.value === 'grande') || (saved !== 'large' && r.value === 'pequeno');
    r.addEventListener('change', function() {
      var scale = r.value === 'grande' ? 'large' : 'normal';
      try { localStorage.setItem('govbr_text_scale', scale); } catch(e) {}
      document.documentElement.classList.toggle('text-large', scale === 'large');
      setTimeout(function() { location.href = 'opcoes-ajuda.html'; }, 350);
    });
  });
</script>
</body>
</html>
