<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Qual texto você lê melhor?</title>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: 48px 24px 16px;
    display: flex;
    flex-direction: column;
  }

  h1.title {
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--govbr-blue);
    margin: 0 0 40px;
  }

  .size-option {
    display: block;
    cursor: pointer;
    background: #d9d9d9;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 24px 20px;
    margin-bottom: 28px;
    color: #1c1c1c;
    font-weight: 400;
  }

  .size-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .size-option.small { font-size: 15px; line-height: 1.4; }
  .size-option.large { font-size: 22px; line-height: 1.35; font-weight: 500; }

  .size-option:has(input:checked) {
    border-color: var(--govbr-blue);
    background: #dce8fa;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <h1 class="title">Qual texto você lê melhor?</h1>

    <label class="size-option small">
      <input type="radio" name="tamanho-texto" value="pequeno" onchange="location.href='opcoes-ajuda.html'">
      Texto comprido aqui pra teste de tamanho
    </label>

    <label class="size-option large">
      <input type="radio" name="tamanho-texto" value="grande" onchange="location.href='opcoes-ajuda.html'">
      Texto comprido aqui pra teste de tamanho
    </label>
  </div>

  <div class="step-dots">
    <span class="dot"></span>
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

</div>
</body>
</html>
