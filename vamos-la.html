<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamanho de letra</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) 0;
    display: flex;
    flex-direction: column;
  }

  h1.title {
    text-align: center;
    font-size: var(--fs-title);
    font-weight: 700;
    color: var(--govbr-blue);
    margin: 0 0 var(--space-xl);
  }

  .size-option {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    background: var(--gray-100);
    border: 3px solid var(--gray-300);
    border-radius: var(--radius-md);
    padding: var(--space-lg) var(--space-md);
    margin-bottom: var(--space-lg);
    color: var(--gray-900);
    font-weight: 600;
    font-size: var(--fs-button);
    min-height: var(--touch-target);
  }

  .size-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  /* This option's label always previews the "large" scale's button size (21px,
     matching html.text-large's --fs-button) so it stays consistent with what the
     whole app actually becomes once it's selected - no size jump on selection. */
  .size-option.larger {
    font-size: 21px;
  }

  .size-option:has(input:checked) {
    border-color: var(--govbr-blue);
    background: #dce8fa;
  }

  .size-option:has(input:focus-visible) {
    outline: 3px solid var(--govbr-blue-vivid);
    outline-offset: 2px;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-xs);
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="title">Escolha a forma mais confortável para visualizar as telas do aplicativo.</h1>

    <label class="size-option">
      <input type="radio" name="tamanho-texto" value="medio">
      Eu prefiro esta opção
    </label>

    <label class="size-option larger">
      <input type="radio" name="tamanho-texto" value="maior">
      Eu prefiro esta opção
    </label>
  </div>

  <div class="bottom-section">
    <button class="br-button primary large block" type="button" onclick="location.href='opcoes-ajuda.html'">Próximo</button>
  </div>

  <div class="step-dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

</div>

<script>
  var saved = 'normal';
  try { saved = localStorage.getItem('govbr_text_scale') || 'normal'; } catch(e) {}

  function applyScale(scale) {
    document.documentElement.classList.toggle('text-large', scale === 'large');
  }
  applyScale(saved);

  var radios = document.querySelectorAll('input[name="tamanho-texto"]');
  radios.forEach(function(r) {
    r.checked = (saved === 'large' && r.value === 'maior') || (saved !== 'large' && r.value === 'medio');
    r.addEventListener('change', function() {
      var scale = r.value === 'maior' ? 'large' : 'normal';
      try { localStorage.setItem('govbr_text_scale', scale); } catch(e) {}
      applyScale(scale);
    });
  });
</script>
</body>
</html>
