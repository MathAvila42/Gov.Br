<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>entrar</title>
<script>(function(){try{if(localStorage.getItem('govbr_text_scale')==='large')document.documentElement.classList.add('text-large');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/vendor/govbr-ds-core.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  .content {
    flex: 1;
    padding: var(--space-2xl) var(--page-x) 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .entrar-logo {
    width: 220px;
    max-width: 56%;
    height: auto;
    flex-shrink: 0;
  }

  .spacer-lg {
    flex: 1.1;
  }

  .spacer-sm {
    flex: 1;
  }

  .field-wrap {
    width: 100%;
    flex-shrink: 0;
  }

  .field-gap {
    height: var(--space-lg);
    flex-shrink: 0;
  }

  .back-btn {
    align-self: flex-start;
  }

  .text-field {
    width: 100%;
    height: var(--touch-target);
    border: none;
    border-radius: var(--radius-md);
    background: var(--gray-100);
    font-size: var(--fs-body) !important;
    color: var(--gray-900);
    padding: 0 var(--space-md);
    font-family: inherit;
  }

  .text-field::placeholder {
    color: var(--gray-700);
    font-style: normal;
  }

  .text-field:focus {
    outline: 3px solid var(--govbr-blue-vivid);
    outline-offset: 2px;
  }

  .forgot-link {
    flex-shrink: 0;
    color: var(--govbr-blue);
    font-size: var(--fs-body);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .bottom-section {
    flex-shrink: 0;
    padding: 0 var(--page-x) var(--space-2xl);
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: var(--touch-target);
    border: none;
    border-radius: 999px;
    font-size: var(--fs-button);
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: var(--govbr-blue);
    color: #fff;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="content">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="Voltar">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <img class="entrar-logo" src="assets/govbr-logo.png" alt="gov.br">

    <div class="spacer-lg"></div>

    <div class="field-wrap">
      <input class="text-field" type="text" inputmode="numeric" placeholder="Número de CPF" aria-label="Número de CPF">
    </div>

    <div class="field-gap"></div>

    <div class="field-wrap">
      <input class="text-field" type="password" placeholder="Senha" aria-label="Senha">
    </div>

    <div class="spacer-sm"></div>

    <a class="forgot-link" href="#">Esqueci a senha</a>

    <div class="spacer-sm"></div>
  </div>

  <div class="bottom-section">
    <button class="btn-primary" type="button" onclick="location.href='vamos-provar.html'">Entrar</button>
  </div>

</div>
</body>
</html>
